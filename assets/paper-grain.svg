<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <filter id="fibers" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.58 0.24" numOctaves="3" seed="27" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncR type="linear" slope="0.8" intercept="0.2"/>
      <feFuncG type="linear" slope="0.8" intercept="0.2"/>
      <feFuncB type="linear" slope="0.8" intercept="0.2"/>
      <feFuncA type="linear" slope="0" intercept="1"/>
    </feComponentTransfer>
  </filter>
  <rect width="256" height="256" filter="url(#fibers)"/>
</svg>
